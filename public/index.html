<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/logo.jpg"><title>PR Tire – Book Puncture Protection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f4f5;--card:#fff;--tx:#18181b;--mu:#71717a;--bd:#e4e4e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px Georgia,'Times New Roman',serif}
header{background:#fff;text-align:center;padding:10px;border-bottom:4px solid #111}header img{max-width:300px;width:80%}
main{max-width:480px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px;font-weight:600}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button,a.b{display:block;width:100%;text-align:center;background:#111;color:#fff;border:0;border-radius:10px;padding:13px;font:700 16px inherit;margin-top:16px;cursor:pointer;text-decoration:none}
a.g{background:#16a34a}.hide{display:none}.mu{color:var(--mu)}
</style></head><body>
<header><img src="/logo.jpg" alt="PR Tire"></header>
<main><div class="card" id="f">
<label>Booking type</label><select id="type" onchange="co.classList.toggle('hide',this.value!='Fleet')"><option>Retail</option><option value="Fleet">Fleet / Trailer</option></select>
<div id="co" class="hide"><label>Company</label><input id="company"></div>
<label>Your name</label><input id="name"><label>WhatsApp number *</label><input id="phone" type="tel" placeholder="082 123 4567">
<label>Vehicle (fleet: number of vehicles)</label><input id="vehicle" placeholder="BMW 3 Series"><label>Tyre size(s)</label><input id="size" placeholder="225/45 R18">
<label>Number of tyres *</label><input id="qty" type="number" min="1"><label>Location</label><input id="loc">
<label>Preferred date</label><input id="date" placeholder="Saturday"><label>Preferred time</label><input id="time" placeholder="10:00">
<button onclick="go()">Request booking</button><p class="mu" id="err"></p></div>
<div class="card hide" id="ok"><h2>Request received ✅</h2><p>We'll reply on WhatsApp with your price and confirmation. Want a faster reply?</p><a class="b g" id="wa" target="_blank">Message us on WhatsApp</a></div></main>
<script>
var NUM='27623297176',$=function(i){return document.getElementById(i)};
function go(){var d={};['type','company','name','phone','vehicle','size','qty','loc','date','time'].forEach(function(k){d[k]=$(k).value});
 fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(j){
  if(j.error){$('err').textContent=j.error;return}
  var t='Hi PR Tire 👋\nI would like to book Puncture Protection.\n\n🚗 Vehicle: '+d.vehicle+'\n📏 Tyre size: '+d.size+'\n🔢 Number of tyres: '+d.qty+'\n📍 Location: '+d.loc+'\n📅 Preferred date: '+d.date+'\n⏰ Preferred time: '+d.time;
  $('wa').href='https://wa.me/'+NUM+'?text='+encodeURIComponent(t);$('f').classList.add('hide');$('ok').classList.remove('hide')}).catch(function(){$('err').textContent='Connection problem, please try again.'})}
</script></body></html>
